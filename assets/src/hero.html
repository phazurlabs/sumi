<!doctype html>
<!-- README hero. Rendered to assets/hero-dark.png and assets/hero-light.png by
     assets/src/render.mjs (?theme=dark|light). 1600x640 CSS px at 2x. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root { --wall: #151412; --ink: #F1ECE4; --muted: #8C857B; --coral: #E8715A; --paper: #F4EFE6; --paper-ink: #1A1A2E; }
  :root[data-theme="light"] { --wall: #E9E4DA; --ink: #16140F; --muted: #6F685D; --paper: #FFFDF8; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 640px; overflow: hidden; background: var(--wall); }
  .wall { position: absolute; inset: 0; }
  .wall svg { width: 100%; height: 100%; display: block; }
  /* wheatpaste poster */
  .paste { position: absolute; left: 96px; top: 70px; width: 420px; height: 500px; background: var(--paper);
           transform: rotate(-3.2deg); box-shadow: 0 30px 60px rgba(0,0,0,.35), 0 2px 0 rgba(0,0,0,.08);
           clip-path: polygon(0 1%, 4% 0, 30% 1.2%, 58% 0, 86% .8%, 100% 0, 99.2% 30%, 100% 62%, 99% 100%, 70% 98.8%, 40% 100%, 12% 99%, 0 100%, .8% 64%, 0 34%); }
  .paste::after { content: ""; position: absolute; inset: 0; background:
      linear-gradient(115deg, transparent 40%, rgba(0,0,0,.06) 41%, transparent 43%),
      linear-gradient(35deg, transparent 62%, rgba(0,0,0,.05) 63%, transparent 65%); mix-blend-mode: multiply; }
  .paste svg { position: absolute; left: 50%; top: 52%; width: 330px; transform: translate(-50%, -50%); }
  .paste .caption { position: absolute; left: 28px; bottom: 22px; font: 500 13px/1 'JetBrains Mono', monospace; letter-spacing: .08em; color: var(--paper-ink); opacity: .55; }
  .tape { position: absolute; width: 110px; height: 34px; background: rgba(240,228,200,.72); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .t1 { left: 60px; top: 58px; transform: rotate(-38deg); }
  .t2 { left: 452px; top: 60px; transform: rotate(32deg); }
  /* type */
  .tag { position: absolute; left: 610px; top: 36px; font: 400 210px/1 'Permanent Marker', cursive; color: var(--coral);
         transform: rotate(-5deg); text-shadow: 0 0 22px rgba(232,113,90,.35); letter-spacing: -.01em; }
  .drip { position: absolute; width: 7px; border-radius: 0 0 6px 6px; background: var(--coral); opacity: .9; }
  .d1 { left: 702px; top: 226px; height: 46px; } .d2 { left: 886px; top: 222px; height: 26px; width: 6px; } .d3 { left: 1062px; top: 218px; height: 72px; width: 8px; }
  h1 { position: absolute; left: 616px; top: 300px; width: 900px; font: 400 92px/.94 'Anton', sans-serif; color: var(--ink);
       text-transform: uppercase; letter-spacing: .005em; }
  .sig { position: absolute; left: 620px; bottom: 58px; font: 500 16px/1 'JetBrains Mono', monospace; color: var(--muted); letter-spacing: .06em; }
  .sig b { color: var(--coral); font-weight: 500; }
</style>
</head>
<body>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
