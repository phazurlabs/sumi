<!doctype html>
<!-- README hero. Rendered to assets/hero-dark.png and assets/hero-light.png by
     assets/src/render.mjs (?theme=dark|light), then shipped as JPEG. 1600x640 CSS px at 2x.
     Brand: the Sumi mark is shared with Shippr (Sumi is Shippr's design layer). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  /* Shippr brand tokens: paper #f3f0e8, ink #111110, signal #ff4f00 (#ff7a3d as a graphic on ink) */
  :root { --wall: #141412; --ink: #f3f0e8; --muted: #8b8474; --signal: #ff7a3d; --paper: #f3f0e8; --paper-ink: #111110; }
  :root[data-theme="light"] { --wall: #e8e3d8; --ink: #111110; --muted: #6b665c; --signal: #ff4f00; --paper: #fbf9f4; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 640px; overflow: hidden; background: var(--wall); }
  .wall { position: absolute; inset: 0; }
  .wall svg { width: 100%; height: 100%; display: block; }
  /* wheatpaste poster */
  .paste { position: absolute; left: 96px; top: 70px; width: 420px; height: 500px; background: var(--paper);
           transform: rotate(-3.2deg); box-shadow: 0 30px 60px rgba(0,0,0,.35), 0 2px 0 rgba(0,0,0,.08);
           clip-path: polygon(0 1%, 4% 0, 30% 1.2%, 58% 0, 86% .8%, 100% 0, 99.2% 30%, 100% 62%, 99% 100%, 70% 98.8%, 40% 100%, 12% 99%, 0 100%, .8% 64%, 0 34%); }
  .paste::after { content: ""; position: absolute; inset: 0; background:
      linear-gradient(115deg, transparent 40%, rgba(0,0,0,.06) 41%, transparent 43%),
      linear-gradient(35deg, transparent 62%, rgba(0,0,0,.05) 63%, transparent 65%); mix-blend-mode: multiply; }
  .paste .mark { position: absolute; left: 50%; top: 42%; width: 250px; transform: translate(-50%, -50%); color: var(--paper-ink); }
  .paste .word { position: absolute; left: 0; right: 0; top: 356px; text-align: center; font: 700 64px/1 'Clash Display', sans-serif; letter-spacing: -.03em; color: var(--paper-ink); }
  .paste .caption { position: absolute; left: 28px; right: 28px; bottom: 22px; display: flex; justify-content: space-between; font: 500 13px/1 'JetBrains Mono', monospace; letter-spacing: .06em; color: var(--paper-ink); opacity: .55; }
  .tape { position: absolute; width: 110px; height: 34px; background: rgba(240,228,200,.72); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .t1 { left: 60px; top: 58px; transform: rotate(-38deg); }
  .t2 { left: 452px; top: 60px; transform: rotate(32deg); }
  /* type */
  .tag { position: absolute; left: 610px; top: 36px; font: 400 210px/1 'Permanent Marker', cursive; color: var(--signal);
         transform: rotate(-5deg); letter-spacing: -.01em; }
  .drip { position: absolute; width: 7px; border-radius: 0 0 6px 6px; background: var(--signal); opacity: .9; }
  .d1 { left: 702px; top: 226px; height: 46px; } .d2 { left: 886px; top: 222px; height: 26px; width: 6px; } .d3 { left: 1062px; top: 218px; height: 72px; width: 8px; }
  h1 { position: absolute; left: 616px; top: 306px; width: 920px; font: 600 88px/.96 'Clash Display', sans-serif; color: var(--ink); letter-spacing: -.035em; word-spacing: .1em; }
  .sig { position: absolute; left: 620px; bottom: 58px; font: 500 16px/1 'JetBrains Mono', monospace; color: var(--muted); letter-spacing: .06em; }
  .sig b { color: var(--signal); font-weight: 500; }
</style>
</head>
<body>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'dark';</script>
<div class="wall">
  <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <filter id="concrete"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="4" seed="7" /><feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="table" tableValues="0 .22" /></feComponentTransfer></filter>
    <filter id="stain"><feTurbulence type="fractalNoise" baseFrequency=".004 .012" numOctaves="3" seed="3" /><feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="table" tableValues="0 .28" /></feComponentTransfer></filter>
    <rect width="100%" height="100%" filter="url(#stain)" />
    <rect width="100%" height="100%" filter="url(#concrete)" />
    <g stroke="rgba(0,0,0,.18)" stroke-width="2"><line x1="0" y1="212" x2="1600" y2="214" /><line x1="0" y1="428" x2="1600" y2="426" /><line x1="560" y1="0" x2="562" y2="212" /><line x1="1180" y1="214" x2="1178" y2="428" /><line x1="300" y1="428" x2="302" y2="640" /><line x1="1420" y1="0" x2="1421" y2="212" /></g>
  </svg>
</div>

<div class="paste">
  <svg class="mark" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="24" height="24" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="5" width="8" height="8" rx="1.5" fill="#ff4f00"/><path d="M5 18h16" stroke="currentColor" stroke-width="2"/></svg>
  <div class="word">sumi</div>
  <div class="caption"><span>THE DESIGN LAYER OF SHIPPR</span><span>SATX</span></div>
</div>
<div class="tape t1"></div><div class="tape t2"></div>

<div class="tag">taste.</div>
<div class="drip d1"></div><div class="drip d2"></div><div class="drip d3"></div>
<h1>The design crew<br />for Claude Code.</h1>
<div class="sig">sourced from the wall &nbsp;<b>/</b>&nbsp; measured, not remembered &nbsp;<b>/</b>&nbsp; built for inheritance, not hype</div>
</body>
</html>
